[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-maestro"
version = "0.2.2"
description = "A small, evidence-first harness control layer for project adapters, documentation, and review lenses."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "SungKong00" }]
dependencies = []

[project.scripts]
maestro = "maestro.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maestro = ["resources/**/*.json", "resources/**/*.md"]
