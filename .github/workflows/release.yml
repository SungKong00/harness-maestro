name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable release identity
        run: |
          python scripts/release_manifest.py --check --tag-ref "$GITHUB_REF_NAME"
          git diff --exit-code
      - name: Build release artifacts
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/verify_wheel.py dist/harness_maestro-*.whl
          shasum -a 256 dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: harness-maestro-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
