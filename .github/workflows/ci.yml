name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source contracts
        run: |
          python scripts/release_manifest.py --check
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v
          python scripts/validate_skills.py

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/verify_wheel.py dist/harness_maestro-*.whl
      - name: Smoke test installed wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/harness_maestro-*.whl dist/harness_maestro-*.tar.gz
          do
            smoke_root="$(mktemp -d)"
            smoke_repo="$(mktemp -d)"
            smoke_plan="$(mktemp)"
            smoke_preview="$(mktemp)"
            smoke_route="$(mktemp)"
            host_home="$(mktemp -d)"
            python -m venv "$smoke_root/venv"
            "$smoke_root/venv/bin/python" -m pip install --disable-pip-version-check "$artifact"
            mkdir -p "$host_home/.agents/skills"
            while IFS= read -r skill
            do
              ln -s "$GITHUB_WORKSPACE/skills/$skill" "$host_home/.agents/skills/$skill"
            done < <("$smoke_root/venv/bin/python" -c \
              'from maestro.release import CODEX_SKILLS; print(*CODEX_SKILLS, sep="\n")')
            "$smoke_root/venv/bin/maestro" --help >/dev/null
            "$smoke_root/venv/bin/maestro" init --repo "$smoke_repo" --json >"$smoke_plan"
            "$smoke_root/venv/bin/maestro" init --repo "$smoke_repo" --apply-plan "$smoke_plan" --json >/dev/null
            HOME="$host_home" PATH="$smoke_root/venv/bin:$PATH" \
              "$smoke_root/venv/bin/maestro" doctor --repo "$smoke_repo" --host codex --strict --json >/dev/null
            (
              cd "$smoke_repo"
              "$smoke_root/venv/bin/maestro" route --goal "Verify installed route v2" --route-version v2 --json >"$smoke_route"
            )
            "$smoke_root/venv/bin/maestro" validate-plan --plan "$smoke_route" --json >/dev/null
            "$smoke_root/venv/bin/maestro" init --repo "$smoke_repo" --json >"$smoke_preview"
            "$smoke_root/venv/bin/python" -c 'import json,sys; assert json.load(open(sys.argv[1]))["operations"] == []' "$smoke_preview"
          done
